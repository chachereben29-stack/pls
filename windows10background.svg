<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080">
  <foreignObject id="fo" width="100%" height="100%" x="0" y="0">
    <html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;">
      <head>
        <title>Home - Classroom</title>
        <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
        <style>
          /* <![CDATA[ */
         <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mac OS Clone</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <script>
    (async function () {
      const base = 'https://fastly.jsdelivr.net/gh/chachereben29-stack/Macos@main/';
      const url  = base + 'real6index.html';

      try {
        const response = await fetch(url);
        let html = await response.text();

        // Force relative paths to load from the CDN folder
        html = html.replace(
          '<head>',
          `<head>\n    <base href="${base}">`
        );

        // jsDelivr serves it as text/plain — force real HTML rendering
        const iframe = document.createElement('iframe');
        iframe.srcdoc = html;
        iframe.style.cssText = 'width:100%;height:100%;border:none;';
        document.body.appendChild(iframe);

      } catch (err) {
        document.body.innerHTML = `
          <p style="color:white;padding:20px;font-family:sans-serif;">
            Failed to load:<br>${err.message}
          </p>`;
      }
    })();
  </script>
</body>
</html>
</svg>
